  p.x=Math.max(-800,Math.min(800,nx));p.z=Math.max(0,Math.min(1580,nz));
  p.lt+=dt;if(p.lt>2){if(Math.hypot(p.x-p.lx,p.z-p.lz)<6){p.avoid=1.3;p.ah=Math.random()*6.283}p.lx=p.x;p.lz=p.z;p.lt=0}
  p.g.position.set(p.x,0,p.z);p.g.rotation.y=p.h;const u=p.g.userData;u.ws.forEach(w=>w.rotation.x+=p.v*dt/u.r);
}
function policeUpdate(dt){
  if(!wanted)return;
  if(mode==='show'){endWanted();return}
  wanT+=dt;
  const tx=mode==='walk'?A.x:P.x,tz=mode==='walk'?A.z:P.z;
  if(POL.length<4&&wanT>POL.length*30)spawnPol();
  let near=1e9;const fl=Math.sin(wanT*14)>0;
  POL.forEach(p=>{polMove(p,dt,tx,tz);near=Math.min(near,Math.hypot(p.x-tx,p.z-tz));p.rm.emissiveIntensity=fl?1.5:.1;p.bl.emissiveIntensity=fl?.1:1.5});
  bust=near<7?bust+dt:Math.max(0,bust-dt*.7);escT=near>260?escT+dt:0;
  if(bust>=3){busted();return}
  if(escT>=12){endWanted();showGoal('You lost the cops!',4000);return}
  $('wanted').textContent=bust>0?'\ud83d\udea8 BUSTED IN '+Math.ceil(3-bust)+'...':escT>0?'\ud83d\udea8 Losing them... '+Math.ceil(12-escT)+'s':'\ud83d\udea8 WANTED \u2014 lose the police';
  if(sirenOsc){sirenOsc.frequency.value=800+350*Math.sin(wanT*5);sirenG.gain.value=.05*Math.max(0,1-near/320)}
  mc.fillStyle='#ff3b3b';POL.forEach(p=>{mc.beginPath();mc.arc((790-p.x)*MS,150-p.z*MS,2.5,0,7);mc.fill()});
}
function updFX(dt){
  trafficUpdate(dt);
  gcd=Math.max(0,gcd-dt);kick*=Math.exp(-12*dt);
  const aim=mode==='walk'&&inv[sel]==='pistol';cvs.style.cursor=aim?'none':'';robUpdate(dt,aim);atmUpdate(dt);policeUpdate(dt);
  if(!aim&&document.pointerLockElement&&document.exitPointerLock)document.exitPointerLock();
  TG.forEach(t=>{if(t.down>0)t.down-=dt;t.m.rotation.x+=((t.down>0?1.45:0)-t.m.rotation.x)*Math.min(1,10*dt)});
  for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.life-=dt;if(f.life<=0){S.remove(f.m);FX.splice(i,1)}else if(f.grow)f.m.scale.multiplyScalar(1+f.grow*dt)}
  if(mode==='walk')CONES.forEach(c=>{if(c.v)fly(c,dt)});
}
// Alt+S (testing): unlock and switch to the best car, the Apex Hypercar
function bestCar(){
  owned.add(6);
  if(mode==='show'){setCar(6);return}
  idx=6;S.remove(car);car=buildCar(CARS[6],col());car.position.set(P.x,0,P.z);car.rotation.set(0,P.h,0);S.add(car);P.fuel=1;ui();
}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;mode==='show'?showUpdate(dt):mode==='walk'?walkUpdate(dt):driveUpdate(dt);updFX(dt);dome.position.copy(cam.position);sunDisc.position.copy(cam.position).addScaledVector(SUNDIR,700);sunDisc.lookAt(cam.position);if(Q&&COMP){COMP.gp.uniforms.time.value=(now*.001)%100;COMP.render()}else R.render(S,cam)}
// post: bloom, then ACES filmic tone mapping + sRGB + vignette + film grain
const GRADE={uniforms:{tDiffuse:{value:null},time:{value:0},expo:{value:1}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`uniform sampler2D tDiffuse;uniform float time;uniform float expo;varying vec2 vUv;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+time)*43758.5453);}
void main(){vec3 c=aces(texture2D(tDiffuse,vUv).rgb*expo);c=pow(c,vec3(1./2.2));c=mix(vec3(dot(c,vec3(.2126,.7152,.0722))),c,1.18);vec2 q=vUv-.5;c*=1.-dot(q,q)*.8;c+=(hs(vUv*1000.)-.5)*.02;gl_FragColor=vec4(c,1.);}`};
function makeComp(){
  try{
    if(!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.WebGLMultisampleRenderTarget)return null;
    const rt=new THREE.WebGLMultisampleRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,format:THREE.RGBAFormat}),c=new THREE.EffectComposer(R,rt);
    c.addPass(new THREE.RenderPass(S,cam));c.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.55,.9));
    const gp=new THREE.ShaderPass(GRADE);c.addPass(gp);c.gp=gp;return c;
  }catch(e){return null}
}
function applyQ(quiet){
  if(Q>0&&!COMP)COMP=makeComp();
  if(Q>0&&!COMP)Q=0;
  R.outputEncoding=Q?THREE.LinearEncoding:THREE.sRGBEncoding;R.toneMapping=Q?THREE.NoToneMapping:THREE.ACESFilmicToneMapping;R.toneMappingExposure=1;
  size();
  if(!quiet)showGoal('Graphics: '+['Performance','High','Ultra (4K)'][Q]+' \u00b7 press G to change',2500);
}
applyQ(true);
setCar(idx,true);requestAnimationFrame(loop);
